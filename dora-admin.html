<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DoraPDF admin</title>
<style>body{margin:0;background:#07060a;color:#f3eef7;font:15px/1.5 system-ui,sans-serif;padding:24px}h1{font-size:22px}input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #2c2236;background:#120d18;color:#f3eef7}button{background:#ff2e88;border:0;cursor:pointer;font-weight:600}button.g{background:#2c2236}
.card{background:#120d18;border:1px solid #2c2236;border-radius:16px;padding:16px;margin:14px 0;max-width:900px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid #2c2236;text-align:left;vertical-align:top}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#msg{color:#7dffb0;min-height:22px}</style></head><body>
<h1>DoraPDF admin</h1>
<div class="card row"><input id="key" type="password" placeholder="Admin key" style="flex:1"><button onclick="saveKey()">Save key</button><button class="g" onclick="loadClaims();loadRevs()">Refresh</button></div>
<div id="msg"></div>
<div class="card"><h3 style="margin-top:0">Payment claims</h3><table><thead><tr><th>Date</th><th>Email</th><th>Plan</th><th>Method / TID</th><th>Status</th><th></th></tr></thead><tbody id="claims"><tr><td colspan="6">Enter the key and press Refresh.</td></tr></tbody></table></div>
<div class="card"><h3 style="margin-top:0">Reviews waiting for approval</h3><table><thead><tr><th>Date</th><th>Tool</th><th>Stars</th><th>Name / Review</th><th></th></tr></thead><tbody id="revs"><tr><td colspan="5">Press Refresh.</td></tr></tbody></table></div>
<div class="card"><h3 style="margin-top:0">Set a plan manually</h3><div class="row"><input id="em" placeholder="user@gmail.com" style="flex:1;min-width:220px"><select id="pl"><option value="pro">Pro</option><option value="max">Max</option><option value="none">Remove plan</option></select><input id="mo" type="number" value="1" min="1" max="24" style="width:80px"> months<button onclick="setPlan()">Save</button><button class="g" onclick="ban(true)">Suspend</button><button class="g" onclick="ban(false)">Unsuspend</button><button class="g" onclick="lookup()">Look up</button></div><pre id="user" style="white-space:pre-wrap;font-size:13px"></pre></div>
<script>
const API='https://dorapdf-api.asadch3602.workers.dev';const $=s=>document.querySelector(s);
$('#key').value=sessionStorage.getItem('dak')||'';function saveKey(){sessionStorage.setItem('dak',$('#key').value);loadClaims();loadRevs()}
async function call(p,o={}){const r=await fetch(API+p,{...o,headers:{'Content-Type':'application/json','X-Admin-Key':$('#key').value}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
const say=t=>{$('#msg').textContent=t};const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loadClaims(){try{const j=await call('/admin/claims');$('#claims').innerHTML=j.claims.map(c=>`<tr><td>${new Date(c.at).toLocaleString()}</td><td>${esc(c.email)}</td><td>${esc(c.plan)}</td><td>${esc(c.method)}<br><b>${esc(c.txn)}</b><br>${esc(c.amount)}</td><td>${esc(c.status)}</td><td>${c.status==='pending'?`<button onclick="approve('${esc(c.email)}','${esc(c.plan)}','${esc(c.id)}')">Approve 1 month</button> <button class="g" onclick="reject('${esc(c.email)}','${esc(c.id)}')">Reject</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">No claims yet.</td></tr>';say('Loaded')}catch(e){say('⚠️ '+e.message)}}
async function approve(email,plan,claim){try{await call('/admin/plan',{method:'POST',body:JSON.stringify({email,plan,months:1,claim})});say('Approved '+email);loadClaims()}catch(e){say('⚠️ '+e.message)}}
async function reject(email,claim){try{await call('/admin/plan',{method:'POST',body:JSON.stringify({email,claim})});say('Rejected');loadClaims()}catch(e){say('⚠️ '+e.message)}}
async function setPlan(){try{const j=await call('/admin/plan',{method:'POST',body:JSON.stringify({email:$('#em').value,plan:$('#pl').value,months:+$('#mo').value})});$('#user').textContent=JSON.stringify(j.user,null,2);say('Saved')}catch(e){say('⚠️ '+e.message)}}
async function ban(v){try{const j=await call('/admin/plan',{method:'POST',body:JSON.stringify({email:$('#em').value,ban:v})});$('#user').textContent=JSON.stringify(j.user,null,2);say(v?'Suspended':'Unsuspended')}catch(e){say('⚠️ '+e.message)}}
async function lookup(){try{const j=await call('/admin/user?email='+encodeURIComponent($('#em').value));$('#user').textContent=JSON.stringify(j.user,null,2)}catch(e){say('⚠️ '+e.message)}}
async function loadRevs(){try{const j=await call('/admin/reviews');$('#revs').innerHTML=j.reviews.length?j.reviews.map(r=>`<tr><td>${esc(r.d)}</td><td>${esc(r.tool)}</td><td>${'★'.repeat(r.s)}</td><td><b>${esc(r.name||'—')}</b><br>${esc(r.t)}</td><td><button onclick="revAct('${esc(r.key)}',1)">Approve</button> <button onclick="revAct('${esc(r.key)}',0)">Delete</button></td></tr>`).join(''):'<tr><td colspan="5">No reviews waiting.</td></tr>'}catch(e){say('⚠️ '+e.message)}}
async function revAct(key,ok){try{await call('/admin/review',{method:'POST',body:JSON.stringify({key,approve:!!ok})});say(ok?'Review approved':'Review deleted');loadRevs()}catch(e){say('⚠️ '+e.message)}}
if($('#key').value){loadClaims();loadRevs()}
</script></body></html>
